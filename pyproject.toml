[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mftt"
version = "0.1.0"
description = "Multifidelity triangular transport maps"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Owen Davis"},
  {name = "Gianluca Geraci"},
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.8",
  "jupyter>=1.0",
  "matplotlib>=3.6",
  "nbconvert>=7.0",
  "pytest>=7.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/sandialabs/multifidelity-triangular-transport"
Repository = "https://github.com/sandialabs/multifidelity-triangular-transport"
Documentation = "https://github.com/sandialabs/multifidelity-triangular-transport/tree/main/docs"
Issues = "https://github.com/sandialabs/multifidelity-triangular-transport/issues"

[project.optional-dependencies]
build = ["build>=1.0", "twine>=4.0"]
docs = [
  "sphinx>=8.1,<9",
  "myst-parser>=4,<5",
  "myst-nb>=1.4,<2",
  "furo>=2025.12",
  "sphinx-copybutton>=0.5,<1",
]
dev = [
  "build>=1.0",
  "twine>=4.0",
  "sphinx>=8.1,<9",
  "myst-parser>=4,<5",
  "myst-nb>=1.4,<2",
  "furo>=2025.12",
  "sphinx-copybutton>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
